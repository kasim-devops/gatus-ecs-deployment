endpoints:
  - name: Gatus Health
    group: internal
    url: "http://localhost:8080/"
    interval: 30s
    conditions:
      - "[STATUS] == 200"

  - name: Google
    group: external
    url: "https://www.google.com"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 500"

  - name: GitHub
    group: external
    url: "https://github.com"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 500"
      - "[CERTIFICATE_EXPIRATION] > 48h"