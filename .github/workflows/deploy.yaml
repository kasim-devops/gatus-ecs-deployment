name: Terraform Deploy

on:
  workflow_run:
    workflows: ["Build and Push"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

env:
  IMAGE_REPO: gatus-ecs-deployment

jobs:
  terraform-deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      
      - name: login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: |
          terraform plan \
            -var="gatus_image=${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_REPO }}:${{ github.event.workflow_run.head_sha }}" \
            -var="aws_region=eu-west-2"

      - name: terraform apply
        run: |
          terraform apply -auto-approve \
            -var="gatus_image=${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_REPO }}:${{ github.event.workflow_run.head_sha }}" \
            -var="aws_region=eu-west-2"

      - name: post-deploy health check
        run: |
          curl -f --retry 10 --retry-delay 15 --retry-connrefused \
            https://tm.labs.kas-app.xyz/health
  